<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="rob-icon.png" type="image/png">
    <title>Robert Leichtveis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container do Avatar com Imagem */
        .mecha-avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #1f293d 0%, #0d1117 100%);
            border: 2px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .mecha-avatar-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
        }

        .mecha-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        p.bio {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 24px;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Estilo idêntico para os dois botões azuis */
        .btn-blue {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            transition: all 0.2s ease-in-out;
        }

        .btn-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.5);
            background: linear-gradient(135deg, #0072ff, #00c6ff);
        }

        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Avatar com a imagem externa -->
        <div class="mecha-avatar-container">
            <img src="https://robertdelima.github.io/rob-icon.png" alt="Robert Leichtveis Avatar" class="mecha-img">
        </div>

        <h1>Robert Leichtveis</h1>
        <p class="bio">Sistemas & Tecnologia</p>

        <div class="links-container">
            <!-- Botão Linktree -->
            <a href="https://linktr.ee/RobertLeichtveis" target="_blank" rel="noopener noreferrer" class="btn-blue">
                🌐 Acessar Linktree Oficial
            </a>

            <!-- Botão Google Sites -->
            <a href="https://sites.google.com/view/robertdelima/in%C3%ADcio" target="_blank" rel="noopener noreferrer" class="btn-blue">
                🖥️ Meu Site Oficial (Google Sites)
            </a>
        </div>

        <footer>
            © Robert Leichtveis
        </footer>
    </div>

</body>
</html>
